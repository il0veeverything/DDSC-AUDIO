<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DDSC AUDIO - Debugger & Analyzer</title>
  <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web/dist/ort.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <style>
    :root {
      --md-sys-color-primary: #0061a4;
      --md-sys-color-on-primary: #ffffff;
      --md-sys-color-primary-container: #d1e4ff;
      --md-sys-color-on-primary-container: #001d36;
      --md-sys-color-surface: #fdfcff;
      --md-sys-color-surface-variant: #e0e2ec;
      --md-sys-color-on-surface: #1a1c1e;
      --md-sys-color-on-surface-variant: #43474e;
      --md-sys-color-outline: #73777f;
      --md-sys-color-bg: #f8f9fe;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--md-sys-color-bg);
      color: var(--md-sys-color-on-surface);
      padding: 16px;
      max-width: 600px;
      margin: 0 auto;
    }

    header {
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      letter-spacing: -0.5px;
    }
    
    .header-controls {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .model-badge {
      font-size: 0.75rem;
      background: var(--md-sys-color-primary-container);
      color: var(--md-sys-color-on-primary-container);
      padding: 4px 10px;
      border-radius: 12px;
      font-weight: 500;
    }

    .card {
      background: var(--md-sys-color-surface);
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 20px;
      padding: 20px;
      margin-bottom: 16px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.04);
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.875rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-bottom: 16px;
    }
    .status-icon { font-size: 1.1rem; }
    .status-bar.ready .status-icon { color: #10b981; }
    .status-bar.error .status-icon { color: #ef4444; }

    .control-grid {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .file-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 2px dashed var(--md-sys-color-outline);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      background: var(--md-sys-color-bg);
    }
    .file-input-wrapper input[type="file"] {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .file-input-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
      color: var(--md-sys-color-on-surface-variant);
      font-weight: 500;
    }

    .section-title {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .range-box {
      background: var(--md-sys-color-bg);
      border: 1px solid var(--md-sys-color-surface-variant);
      border-radius: 12px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .waveform-container {
      width: 100%;
      height: 60px;
      background: #0f172a;
      border-radius: 8px;
      overflow: hidden;
      position: relative;
    }
    #waveformCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }

    .slider-container {
      position: relative;
      height: 36px;
      margin: 5px 0;
    }

    .slider-track {
      position: absolute;
      top: 14px;
      left: 0;
      right: 0;
      height: 8px;
      border-radius: 4px;
      background: var(--md-sys-color-surface-variant);
    }

    .slider-range-highlight {
      position: absolute;
      top: 14px;
      height: 8px;
      border-radius: 4px;
      background: var(--md-sys-color-primary);
    }

    .slider-container input[type="range"] {
      position: absolute;
      top: 8px;
      width: 100%;
      pointer-events: none;
      -webkit-appearance: none;
      appearance: none;
      background: none;
      margin: 0;
    }

    .slider-container input[type="range"]::-webkit-slider-thumb {
      pointer-events: auto;
      width: 20px;
      height: 20px;
      border-radius: 50%;
      background: var(--md-sys-color-primary);
      border: 2px solid white;
      box-shadow: 0 1px 4px rgba(0,0,0,0.3);
      cursor: pointer;
      -webkit-appearance: none;
    }

    .time-readout {
      display: flex;
      justify-content: space-between;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--md-sys-color-on-surface-variant);
    }

    .call-detect-panel {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 8px;
      align-items: flex-end;
    }

    .thresh-panel {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 8px;
      margin-top: 4px;
    }

    .input-field {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .input-field label {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    .input-row {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .select-box, .text-input {
      width: 100%;
      padding: 10px;
      font-size: 0.9rem;
      border: 1px solid var(--md-sys-color-outline);
      border-radius: 8px;
      background: var(--md-sys-color-surface);
      color: var(--md-sys-color-on-surface);
      outline: none;
    }

    .btn {
      width: 100%;
      height: 44px;
      border-radius: 22px;
      border: none;
      background-color: var(--md-sys-color-primary);
      color: var(--md-sys-color-on-primary);
      font-size: 0.95rem;
      font-weight: 500;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      cursor: pointer;
    }
    .btn:disabled {
      background-color: var(--md-sys-color-surface-variant);
      color: var(--md-sys-color-outline);
      cursor: not-allowed;
    }
    .btn-secondary {
      background-color: transparent;
      color: var(--md-sys-color-primary);
      border: 1px solid var(--md-sys-color-outline);
    }
    .btn-small {
      height: 38px;
      font-size: 0.85rem;
      padding: 0 12px;
      border-radius: 8px;
      white-space: nowrap;
    }

    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .progress-bar {
      height: 4px;
      background: var(--md-sys-color-surface-variant);
      border-radius: 2px;
      overflow: hidden;
      margin-top: 12px;
      display: none;
    }
    .progress-fill {
      height: 100%;
      width: 0%;
      background: var(--md-sys-color-primary);
      transition: width 0.1s;
    }

    .metric-hero {
      text-align: center;
      padding: 12px 0;
    }
    .metric-hero .val {
      font-size: 2.5rem;
      font-weight: 700;
      color: var(--md-sys-color-primary);
      line-height: 1;
    }
    .metric-hero .unit {
      font-size: 0.875rem;
      color: var(--md-sys-color-on-surface-variant);
      margin-top: 4px;
    }

    .metrics-sub {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-top: 16px;
      border-top: 1px solid var(--md-sys-color-surface-variant);
      padding-top: 16px;
    }
    .sub-box {
      text-align: center;
    }
    .sub-box .val {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .sub-box .lbl {
      font-size: 0.75rem;
      color: var(--md-sys-color-on-surface-variant);
    }

    canvas.chart-preview {
      width: 100%;
      height: 180px;
      background-color: #0f172a;
      border-radius: 12px;
      margin-top: 16px;
    }

    .log-details {
      margin-top: 16px;
    }
    summary {
      font-size: 0.85rem;
      color: var(--md-sys-color-outline);
      cursor: pointer;
    }
    .debug-box {
      background: #111827;
      color: #38bdf8;
      font-family: monospace;
      padding: 12px;
      border-radius: 8px;
      font-size: 0.75rem;
      max-height: 150px;
      overflow-y: auto;
      margin-top: 8px;
    }

    .debug-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .debug-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .debug-modal-card {
      background: #18181b;
      color: #f4f4f5;
      border-radius: 16px;
      padding: 20px;
      width: 95%;
      max-width: 750px;
      height: 92vh;
      display: flex;
      flex-direction: column;
      gap: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .debug-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #27272a;
      padding-bottom: 8px;
      gap: 8px;
      flex-wrap: wrap;
    }
    .debug-title {
      font-size: 1.1rem;
      font-weight: 700;
      color: #38bdf8;
    }
    .debug-toolbar {
      display: flex;
      gap: 8px;
      align-items: center;
      font-size: 0.8rem;
    }
    .step-edit-panel-disabled { opacity: 0.45; filter: grayscale(0.7); }
    .interval-detail { display:block; font-size:0.68rem; line-height:1.45; color:var(--md-sys-color-on-surface-variant); margin-top:2px; }
    .model-file-input { display:none; }
    .debug-canvas-container {
      position: relative;
      flex: 1;
      background: #09090b;
      border-radius: 8px;
      overflow-y: auto;
      overflow-x: hidden;
      border: 1px solid #27272a;
      user-select: none;
      -webkit-overflow-scrolling: touch;
      overflow-anchor: none;
    }
    #debugCanvas {
      display: block;
      width: 100%;
      cursor: default;
    }
    .debug-actions {
      display: flex;
      gap: 8px;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
    }

    /* ペース分析モーダル スタイル */
    .pace-modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 3000;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease;
    }
    .pace-modal-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .pace-modal-card {
      background: #18181b;
      color: #f4f4f5;
      border-radius: 16px;
      padding: 24px;
      width: 90%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .pace-modal-title {
      font-size: 1.2rem;
      font-weight: 700;
      color: #f4f4f5;
    }
    .pace-modal-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .pace-modal-field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .pace-modal-field label {
      font-size: 0.8rem;
      color: #a1a1aa;
    }
    .pace-modal-field input[type="text"],
    .pace-modal-field input[type="number"] {
      background: #27272a;
      border: 1px solid #3f3f46;
      color: #f4f4f5;
      border-radius: 8px;
      padding: 10px;
      font-size: 0.9rem;
      outline: none;
    }
    .pace-modal-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-top: 4px;
    }
    .pace-modal-toggle span {
      font-size: 0.85rem;
      color: #a1a1aa;
    }
    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider-toggle {
      position: absolute; cursor: pointer; top: 0; left: 0; right: 0; bottom: 0;
      background-color: #3f3f46;
      transition: .2s;
      border-radius: 24px;
    }
    .slider-toggle:before {
      position: absolute; content: ""; height: 18px; width: 18px; left: 3px; bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }
    input:checked + .slider-toggle { background-color: #007aff; }
    input:checked + .slider-toggle:before { transform: translateX(20px); }
    .pace-modal-actions {
      display: flex;
      gap: 12px;
      justify-content: flex-end;
      margin-top: 8px;
    }
  </style>
</head>
<body>

<header>
  <h1>DDSC AUDIO</h1>
  <div class="header-controls">
    <span class="model-badge" id="modelBadge">モデル確認中...</span>
    <button class="btn btn-secondary btn-small" id="changeModelBtn" style="width:auto;">モデル変更</button>
    <input class="model-file-input" type="file" id="modelFileInput" accept=".onnx">
  </div>
</header>

<div class="card">
  <div id="statusBar" class="status-bar">
    <span class="material-icons status-icon">hourglass_empty</span>
    <span id="statusText">モデル読み込み中...</span>
  </div>

  <div class="control-grid">
    <div class="file-input-wrapper">
      <input type="file" id="mediaFile" accept="audio/*,video/*,.mp4,.mov,.webm,.avi,.mkv,.csv" disabled>
      <div class="file-input-label">
        <span class="material-icons" id="fileIcon">perm_media</span>
        <span id="fileName">音声/動画/CSVファイルを選択</span>
      </div>
    </div>

    <div class="range-box" id="rangeBox" style="display:none;">
      <div class="section-title">
        <span class="material-icons" style="font-size:1.1rem;">space_bar</span> 計測範囲設定
      </div>

      <div class="waveform-container">
        <canvas id="waveformCanvas"></canvas>
      </div>

      <div class="call-detect-panel">
        <div class="input-field">
          <label for="callFreq">コール周波数 (Hz)</label>
          <input type="number" id="callFreq" class="text-input" value="586" step="1">
        </div>
        <div class="input-field">
          <label for="callDur">継続時間 (秒)</label>
          <input type="number" id="callDur" class="text-input" value="0.35" step="0.05">
        </div>
        <button id="detectCallBtn" class="btn btn-secondary btn-small">
          <span class="material-icons" style="font-size:1rem;">graphic_eq</span>
          コール音自動検出
        </button>
      </div>

      <div class="slider-container">
        <div class="slider-track"></div>
        <div class="slider-range-highlight" id="rangeHighlight"></div>
        <input type="range" id="startSlider" min="0" max="100" value="0" step="0.1">
        <input type="range" id="endSlider" min="0" max="100" value="100" step="0.1">
      </div>

      <div class="time-readout">
        <span>開始: <strong id="startTimeLabel">0.00</strong>s</span>
        <span>計測長: <strong id="durationLabel">0.00</strong>s</span>
        <span>終了: <strong id="endTimeLabel">0.00</strong>s</span>
      </div>

      <div class="thresh-panel">
        <div class="input-field">
          <label for="highThresh">ON 閾値 (High Prob)</label>
          <input type="number" id="highThresh" class="text-input" value="0.65" min="0.1" max="0.99" step="0.05">
        </div>
        <div class="input-field">
          <label for="lowThresh">OFF 閾値 (Low Prob)</label>
          <input type="number" id="lowThresh" class="text-input" value="0.35" min="0.01" max="0.9" step="0.05">
        </div>
        <div class="input-field">
          <label for="cooldownMs">クールダウン (ms)</label>
          <input type="number" id="cooldownMs" class="text-input" value="60" min="0" step="5">
        </div>
      </div>
    </div>

    <button id="analyzeBtn" class="btn" disabled>
      <span class="material-icons">analytics</span>
      解析開始
    </button>
  </div>

  <div id="progressBar" class="progress-bar">
    <div id="progressFill" class="progress-fill"></div>
  </div>
</div>

<div class="card" id="resultCard" style="display:none;">
  <div class="metric-hero">
    <div class="val" id="countStepDisplay">0</div>
    <div class="unit">カウント</div>
  </div>

  <div class="metrics-sub">
    <div class="sub-box">
      <div class="val" id="positiveFrames">0</div>
      <div class="lbl">検出ステップ</div>
    </div>
    <div class="sub-box">
      <div class="val" id="avgIntervalMs">0.0</div>
      <div class="lbl">平均間隔 (ms)</div>
      <span class="interval-detail" id="oddEvenIntervalDetail">奇数: -　偶数: -</span>
    </div>
  </div>

  <canvas id="chart" class="chart-preview"></canvas>

  <div class="btn-group">
    <button id="openDebugModalBtn" class="btn" style="background-color: #10b981;">
      <span class="material-icons">bug_report</span>
      デバッグ機能（学習データ作成・編集）
    </button>
    <button id="downloadPaceChartBtn" class="btn btn-secondary">
      <span class="material-icons">image</span>
      ペース分析グラフ画像（PNG）を出力
    </button>
    <button id="downloadStepCsvBtn" class="btn btn-secondary">
      <span class="material-icons">table_rows</span>
      ステップCSV出力
    </button>
    <button id="downloadCsvBtn" class="btn btn-secondary">
      <span class="material-icons">download</span>
      全判定データCSV出力
    </button>
  </div>

  <details class="log-details">
    <summary>ログ表示</summary>
    <div id="debugLog" class="debug-box"></div>
  </details>
</div>

<div class="debug-modal-overlay" id="debugModal">
  <div class="debug-modal-card">
    <div class="debug-header">
      <div class="debug-title">デバッグ・ステップ学習データエディタ</div>
      <div class="debug-toolbar">
        <label for="verticalZoom">縦拡大:</label>
        <input type="range" id="verticalZoom" min="1" max="15" value="7.5" step="0.5" style="width: 80px;">
        <span id="zoomLabel">50%</span>
        <button class="btn btn-secondary btn-small" id="addStepBtn">＋ ステップを追加</button>
      </div>
    </div>

    <div style="font-size: 0.8rem; color: #a1a1aa;">
      ステップを選択して範囲を変更できます。右端で移動、左端で削除できます。
    </div>

    <div class="debug-toolbar step-edit-panel-disabled" id="stepEditPanel" style="display:flex; background:#1f2937; border-radius:10px; padding:8px 12px; flex-wrap: wrap;">
      <span style="color:#22d3ee; font-weight:700;" id="stepSelectionStatus">非選択中</span>
      <span id="selectedStepInfo" style="color:#22d3ee; font-weight:700;">ステップ #<span id="selectedStepNum">-</span>（基準フレーム <span id="selectedStepFrame">-</span>）</span>
      <label for="stepRangeSlider" style="margin-left:8px;">選択範囲:</label>
      <input type="range" id="stepRangeSlider" min="2" max="6" value="3" step="1" style="width:110px;">
      <span id="stepRangeLabel" style="font-weight:700; color:#22d3ee;">3</span>
      <button class="btn btn-secondary btn-small" id="deselectStepBtn" style="margin-left:auto;">選択解除</button>
    </div>

    <div class="debug-canvas-container" id="debugCanvasContainer">
      <canvas id="debugCanvas"></canvas>
    </div>

    <div class="debug-actions">
      <span id="debugStatusText" style="font-size: 0.8rem; color: #38bdf8;">準備完了</span>
      <div style="display: flex; gap: 8px;">
        <button class="btn btn-secondary btn-small" id="downloadEditorPaceChartBtn">
          <span class="material-icons" style="font-size:1rem;">image</span>
          グラフ画像保存
        </button>
        <button class="btn btn-secondary btn-small" id="closeDebugModalBtn">完了</button>
        <button class="btn btn-small" id="exportLearningCsvBtn">学習用CSV出力</button>
      </div>
    </div>
  </div>
</div>

<!-- ペース分析モーダル UI -->
<div class="pace-modal-overlay" id="paceModal">
  <div class="pace-modal-card">
    <div class="pace-modal-title">ペース分析グラフ出力</div>
    <div class="pace-modal-form">
      <div class="pace-modal-field">
        <label for="paceTitleInput">タイトル</label>
        <input type="text" id="paceTitleInput" value="ペース分析">
      </div>
      <div style="display: flex; gap: 12px;">
        <div class="pace-modal-field" style="flex: 1;">
          <label for="startTagInput">開始 tag (ID)</label>
          <input type="number" id="startTagInput" value="3" min="1">
        </div>
        <div class="pace-modal-field" style="flex: 1;">
          <label for="endTagInput">終了 tag (ID)</label>
          <input type="number" id="endTagInput" value="3" min="1">
        </div>
      </div>
      <div class="pace-modal-toggle">
        <span>外れ値を除く (IQR法)</span>
        <label class="switch">
          <input type="checkbox" id="removeOutliersToggle" checked>
          <span class="slider-toggle"></span>
        </label>
      </div>

  function setStatus(text, type = '') {

  function framesToSteps(frameList) {
    const sorted = [...frameList].sort((a, b) => a - b);
    const steps = [];
    let i = 0;
    while (i < sorted.length) {
      const start = sorted[i];
      let j = i;
      while (j + 1 < sorted.length && sorted[j + 1] === sorted[j] + 1) j++;
      const runLength = j - i + 1;
      const range = Math.max(2, Math.min(6, runLength - 1));
      steps.push({ id: ++stepIdCounter, baseFrame: start, range: range });
      i = j + 1;
    }
    return steps;
  }

  function sortedBaseFrames() {
    return teacherSteps.map(s => s.baseFrame).sort((a, b) => a - b);
  }

  function findStepById(id) {
    return teacherSteps.find(s => s.id === id) || null;
  }

  async function loadModelFromSource(source, displayName) {
    let newSession;
    if (source instanceof File) {
      newSession = await ort.InferenceSession.create(await source.arrayBuffer());
    } else {
      newSession = await ort.InferenceSession.create(source);
    }
    session = newSession;
    inputName = session.inputNames[0];
    outputNames = session.outputNames;
    loadedModelName = displayName || (typeof source === 'string' ? source.split('/').pop() : 'custom.onnx');
    modelBadge.textContent = loadedModelName;
    setStatus(`モデルロード成功 (${loadedModelName})`, "ready");
    fileInput.disabled = false;
  }

  async function loadLatestModel() {
    const candidatePaths = [];
    for (let maj = 5; maj >= 1; maj--) {
      for (let min = 20; min >= 0; min--) {
        candidatePaths.push(`vampire_ver_${maj}.${min}.onnx`);
        candidatePaths.push(`models/vampire_ver_${maj}.${min}.onnx`);
        candidatePaths.push(`models/vampire_ver${maj}.${min}.onnx`);
      }
    }
    candidatePaths.push('./footstep_lgbm.onnx');

    let loaded = false;
    for (const path of candidatePaths) {
      try {
        await loadModelFromSource(path, path.split('/').pop());
        loaded = true;
        break;
      } catch (e) {
        // 次のモデル候補を検索
      }
    }

    if (!loaded) {
      modelBadge.textContent = "モデル未読み込み";
      setStatus("ONNXモデルが見つかりません。ディレクトリまたはmodelsフォルダを確認してください", "error");
    }
  }
  updateStepEditPanel();
  loadLatestModel();

    } else {

  async function processCsvUpload(file) {
    analyzeBtn.disabled = true;
    rangeBox.style.display = 'none';
    decodedAudioBuffer = null;

    setStatus("CSVファイルをロード中...");
    try {
      const text = await file.text();
      const lines = text.trim().split(/\r?\n/);
      if (lines.length < 2) throw new Error("無効なCSVファイルです。");

      const header = lines[0].split(',').map(h => h.trim());
      const isCountIdx = header.indexOf("Is_Count");
      const timeIdx = header.indexOf("Time_Sec");
      const probIdx = header.indexOf("Probability");

      if (isCountIdx === -1) {
        throw new Error("CSVに 'Is_Count' 列が存在しません。全判定データCSVを選択してください。");
      }

      const hzIndices = [];
      freqBinHzList = [];
      header.forEach((h, idx) => {
        if (h.endsWith('Hz')) {
          hzIndices.push(idx);
          freqBinHzList.push(parseInt(h.replace('Hz', '')));
        }
      });

      if (hzIndices.length === 0) {
        throw new Error("CSV内に周波数データ (Hz) が見つかりませんでした。");
      }

      rawSpectrogramMatrix = [];
      const flatHitFrames = [];
      cachedDeltaDbSeries = [];
      cachedReleaseThreshSeries = [];
      cachedProbabilities = [];

      for (let fIdx = 1; fIdx < lines.length; fIdx++) {
        const line = lines[fIdx].trim();
        if (!line) continue;
        const cols = line.split(',');

        const bins = new Float32Array(hzIndices.length);
        for (let b = 0; b < hzIndices.length; b++) {
          bins[b] = parseFloat(cols[hzIndices[b]]) || -100;
        }
        rawSpectrogramMatrix.push(bins);

        if (probIdx !== -1) cachedProbabilities.push(parseFloat(cols[probIdx]) || 0);

        if (parseInt(cols[isCountIdx]) === 1) {
          flatHitFrames.push(rawSpectrogramMatrix.length - 1);
        }
      }

      teacherSteps = framesToSteps(flatHitFrames);
      selectedStepId = null;

      if (timeIdx !== -1 && rawSpectrogramMatrix.length > 1) {
        currentStartSec = parseFloat(lines[1].split(',')[timeIdx]) || 0;
        const secondSec = parseFloat(lines[2].split(',')[timeIdx]) || (currentStartSec + 0.01);
        frameStepSec = Math.max(0.001, secondSec - currentStartSec);
        currentEndSec = currentStartSec + rawSpectrogramMatrix.length * frameStepSec;
      }

      refreshOutputs();
      resultCard.style.display = 'block';
      setStatus(`CSVの読み込み完了 (${teacherSteps.length} ステップ)`, "ready");
    } catch (err) {
      console.error(err);
      setStatus(`CSV読込エラー: ${err.message}`, "error");
    }
  }

  async function processAudioVideoUpload(file) {
    analyzeBtn.disabled = true;

  }

  function drawWaveformFast() {
    if (!decodedAudioBuffer) return;

    const width = waveformCanvas.width = waveformCanvas.clientWidth || 500;
    const height = waveformCanvas.height = waveformCanvas.clientHeight || 60;

    waveformCtx.clearRect(0, 0, width, height);

    const channelData = decodedAudioBuffer.getChannelData(0);
    const step = Math.ceil(channelData.length / width);
    const amp = height / 2;

    waveformCtx.fillStyle = '#334155';
    waveformCtx.beginPath();

    for (let i = 0; i < width; i++) {
      let min = 1.0;
      let max = -1.0;
      const start = i * step;
      const end = Math.min(start + step, channelData.length);

      for (let j = start; j < end; j += 4) {
        const val = channelData[j];
        if (val < min) min = val;
        if (val > max) max = val;
      }

      if (min > max) { min = 0; max = 0; }
      waveformCtx.fillRect(i, (1 + min) * amp, 1, Math.max(1, (max - min) * amp));
    }

    const maxVal = parseFloat(startSlider.max) || 100;
    const startVal = parseFloat(startSlider.value);
    const endVal = parseFloat(endSlider.value);

    const startX = (startVal / maxVal) * width;
    const endX = (endVal / maxVal) * width;

    waveformCtx.fillStyle = 'rgba(56, 189, 248, 0.3)';
    waveformCtx.fillRect(startX, 0, endX - startX, height);

    waveformCtx.strokeStyle = '#38bdf8';
    waveformCtx.lineWidth = 1.5;
    waveformCtx.strokeRect(startX, 0, endX - startX, height);
  }

  function updateRangeUI() {
    let startVal = parseFloat(startSlider.value);
    let endVal = parseFloat(endSlider.value);

    if (startVal > endVal - 0.1) {

  startSlider.oninput = updateRangeUI;

  function goertzelMag(pcm, sampleRate, targetFreq, offset, length) {
    const k = Math.round((length * targetFreq) / sampleRate);
    const w = (2 * Math.PI * k) / length;
    const cosine = Math.cos(w);
    const sine = Math.sin(w);
    const coeff = 2 * cosine;

    let q0 = 0, q1 = 0, q2 = 0;
    const end = Math.min(pcm.length, offset + length);

    for (let i = offset; i < end; i++) {
      q0 = coeff * q1 - q2 + pcm[i];
      q2 = q1;
      q1 = q0;
    }

    const real = q1 - q2 * cosine;
    const imag = q2 * sine;
    return Math.sqrt(real * real + imag * imag) / (length / 2);
  }

  function detectCallSignal(showMessages = true) {
    if (!decodedAudioBuffer) return;

    const targetFreq = parseFloat(callFreqInput.value) || 586;
    const minDurationSec = parseFloat(callDurInput.value) || 0.35;

    const rawPcm = decodedAudioBuffer.getChannelData(0);
    const sr = decodedAudioBuffer.sampleRate;
    const totalSec = decodedAudioBuffer.duration;

    const windowSec = 0.05;
    const windowSamples = Math.floor(sr * windowSec);
    const stepSamples = Math.floor(sr * 0.02);
    const minConsecutiveHits = Math.ceil(minDurationSec / 0.02);

    const hits = [];
    const threshold = 0.025;

    for (let i = 0; i <= rawPcm.length - windowSamples; i += stepSamples) {
      const mag = goertzelMag(rawPcm, sr, targetFreq, i, windowSamples);
      if (mag > threshold) hits.push(i / sr);
    }

    if (hits.length === 0) {
      if (showMessages) alert(`${targetFreq}Hz のコール音が見つかりませんでした。`);
      return;
    }

    const blocks = [];
    let currentBlock = [hits[0]];

    for (let i = 1; i < hits.length; i++) {
      if (hits[i] - hits[i - 1] <= 0.05) {
        currentBlock.push(hits[i]);
      } else {
        if (currentBlock.length >= minConsecutiveHits) blocks.push(currentBlock);
        currentBlock = [hits[i]];
      }
    }
    if (currentBlock.length >= minConsecutiveHits) blocks.push(currentBlock);

    if (blocks.length === 0) {
      if (showMessages) alert(`${minDurationSec}秒以上継続する ${targetFreq}Hz コール音が見つかりませんでした。`);
      return;
    }

    const firstCallStart = blocks[0][0];
    const lastCallEnd = blocks[blocks.length - 1][blocks[blocks.length - 1].length - 1] + windowSec;

    startSlider.value = firstCallStart.toFixed(2);
    endSlider.value = Math.min(totalSec, lastCallEnd).toFixed(2);
    updateRangeUI();

    if (showMessages) {
      setStatus(`コール音を検出しました (${firstCallStart.toFixed(2)}s 〜 ${lastCallEnd.toFixed(2)}s)`, "ready");
    }
  }

  detectCallBtn.onclick = () => detectCallSignal(true);

  async function readFileWithProgress(file, onProgress) {
    const totalSize = file.size;
    const chunkSize = 2 * 1024 * 1024;
    let loaded = 0;
    const chunks = [];

    for (let start = 0; start < totalSize; start += chunkSize) {
      const end = Math.min(start + chunkSize, totalSize);
      const blob = file.slice(start, end);
      const buf = await blob.arrayBuffer();
      chunks.push(new Uint8Array(buf));
      loaded += buf.byteLength;
      onProgress(Math.round((loaded / totalSize) * 100));
      await new Promise(r => setTimeout(r, 0));
    }

    const merged = new Uint8Array(totalSize);
    let offset = 0;
    for (const chunk of chunks) {
      merged.set(chunk, offset);
      offset += chunk.length;
    }
    return merged.buffer;
  }

  function extractWindowFeaturesFromMatrix(spectrogramMatrix, deltaDbSeries, releaseThreshSeries, windowSize = WINDOW_SIZE) {
    const numFrames = spectrogramMatrix.length;
    if (numFrames < windowSize) return { X: [], validIndices: [] };
    const X = [];
    const validIndices = [];
    for (let i = windowSize - 1; i < numFrames; i++) {
      const windowRows = [];
      for (let w = i - windowSize + 1; w <= i; w++) {
        windowRows.push([
          ...Array.from(spectrogramMatrix[w]),
          Number(deltaDbSeries[w] || 0),
          Number(releaseThreshSeries[w] || 0)
        ]);
      }
      const numCols = windowRows[0].length;
      const rawFlat = [];
      for (let r = 0; r < windowSize; r++) rawFlat.push(...windowRows[r]);
      const fMean = new Float32Array(numCols);
      const fStd = new Float32Array(numCols);
      const fMin = new Float32Array(numCols);
      const fMax = new Float32Array(numCols);
      const fMeanAbsDiff = new Float32Array(numCols);
      const fMaxAbsDiff = new Float32Array(numCols);
      for (let c = 0; c < numCols; c++) {
        let sum = 0, minV = Infinity, maxV = -Infinity;
        for (let r = 0; r < windowSize; r++) {
          const v = windowRows[r][c]; sum += v;
          if (v < minV) minV = v; if (v > maxV) maxV = v;
        }
        const meanV = sum / windowSize;
        fMean[c] = meanV; fMin[c] = minV; fMax[c] = maxV;
        let varSum = 0, diffSum = 0, maxD = 0;
        for (let r = 0; r < windowSize; r++) {
          const d = windowRows[r][c] - meanV; varSum += d * d;
          if (r > 0) {
            const ad = Math.abs(windowRows[r][c] - windowRows[r - 1][c]);
            diffSum += ad; if (ad > maxD) maxD = ad;
          }
        }
        fStd[c] = Math.sqrt(varSum / windowSize);
        fMeanAbsDiff[c] = diffSum / (windowSize - 1);
        fMaxAbsDiff[c] = maxD;
      }
      const featVector = [
        ...rawFlat, ...Array.from(fMean), ...Array.from(fStd),
        ...Array.from(fMin), ...Array.from(fMax),
        ...Array.from(fMeanAbsDiff), ...Array.from(fMaxAbsDiff)
      ];
      if (featVector.length !== EXPECTED_FEATURE_DIM) {
        throw new Error(`特徴量次元数がモデルと一致しません: ${featVector.length}次元 / 期待値 ${EXPECTED_FEATURE_DIM}次元`);
      }
      X.push(featVector); validIndices.push(i);
    }
    return { X, validIndices };
  }

  function extractPositiveProbabilities(results, outputNames, batchLength) {
    const probName = outputNames.find(name => name === 'probabilities') || outputNames.find(name => /prob/i.test(name));
    if (!probName || !results[probName]) throw new Error(`ONNXモデルの確率出力が見つかりません。outputs=${JSON.stringify(outputNames)}`);
    const value = results[probName];
    if (value.data !== undefined && value.dims !== undefined) {
      const data = value.data, dims = value.dims || [];
      if (dims.length >= 2 && dims[dims.length - 1] >= 2) {
        const classCount = dims[dims.length - 1];
        return Array.from({length: batchLength}, (_, i) => Number(data[i * classCount + 1]) || 0);
      }
      if (data.length === batchLength) return Array.from(data, Number);
    }
    const raw = value.data;
    if (raw instanceof Map) {
      const out = [];
      for (const entry of raw.values()) {
        if (entry instanceof Map) out.push(Number(entry.get(1)) || 0);
        else if (entry && typeof entry === 'object') out.push(Number(entry[1] ?? entry['1']) || 0);
      }
      if (out.length === batchLength) return out;
    }
    if (Array.isArray(raw)) {
      const out = raw.map(entry => entry instanceof Map ? Number(entry.get(1)) || 0 : (entry && typeof entry === 'object' ? Number(entry[1] ?? entry['1']) || 0 : Number(entry) || 0));
      if (out.length === batchLength) return out;
    }
    throw new Error(`ONNX確率出力を解析できません。output=${probName}`);
  }

  analyzeBtn.onclick = async () => {
    if (!decodedAudioBuffer || !session) return;

    currentStartSec = parseFloat(startSlider.value);
    currentEndSec = parseFloat(endSlider.value);

    if (currentStartSec >= currentEndSec) {
      alert("計測範囲の指定が不正です。");
      return;
    }

    analyzeBtn.disabled = true;
    fileInput.disabled = true;
    detectCallBtn.disabled = true;
    downloadCsvBtn.disabled = true;
    downloadStepCsvBtn.disabled = true;
    resultCard.style.display = "none";
    progressBar.style.display = "block";
    progressFill.style.width = "0%";

    setStatus("指定範囲の音声データを抽出中...");

    try {
      const sampleRateCache = decodedAudioBuffer.sampleRate;
      const fullPcm = decodedAudioBuffer.getChannelData(0);

      const startSample = Math.floor(currentStartSec * sampleRateCache);
      const endSample = Math.min(fullPcm.length, Math.floor(currentEndSec * sampleRateCache));
      const rawPcm = fullPcm.subarray(startSample, endSample);

      const fftSize = 1024;
      frameStepSec = 0.01;

      const MODEL_SAMPLE_RATE = 48000;

      let analysisPcm = rawPcm;
      if (sampleRateCache !== MODEL_SAMPLE_RATE) {
        const targetLength = Math.max(
          fftSize,
          Math.ceil(rawPcm.length * MODEL_SAMPLE_RATE / sampleRateCache)
        );
        const offlineCtx = new OfflineAudioContext(
          1,
          targetLength,
          MODEL_SAMPLE_RATE
        );
        const srcBuffer = offlineCtx.createBuffer(
          1,
          rawPcm.length,
          sampleRateCache
        );
        srcBuffer.copyToChannel(rawPcm, 0);
        const src = offlineCtx.createBufferSource();
        src.buffer = srcBuffer;
        src.connect(offlineCtx.destination);
        src.start();
        const rendered = await offlineCtx.startRendering();
        analysisPcm = rendered.getChannelData(0);
      }

      const analysisSampleRate = MODEL_SAMPLE_RATE;
      const hopSize = Math.round(analysisSampleRate * frameStepSec);
      const binHz = analysisSampleRate / fftSize;

      freqBinHzList = [];
      const binIndices = [];
      const numFreqBins = 214;
      for (let k = 0; k < numFreqBins; k++) {
        binIndices.push(k);
        freqBinHzList.push(Math.round(k * binHz));
      }

      const totalSteps = Math.floor((analysisPcm.length - fftSize) / hopSize);
      if (totalSteps <= 0) throw new Error("指定された計測範囲が短すぎます");

      const windowFunc = new Float32Array(fftSize);
      for (let i = 0; i < fftSize; i++) {
        windowFunc[i] = 0.54 - 0.46 * Math.cos((2 * Math.PI * i) / (fftSize - 1));
      }

      setStatus("特徴量抽出中...");
      rawSpectrogramMatrix = [];

      for (let i = 0, frameCount = 0; i <= analysisPcm.length - fftSize; i += hopSize, frameCount++) {
        const bins = new Float32Array(numFreqBins);
        for (let b = 0; b < numFreqBins; b++) {
          const k = binIndices[b];
          let re = 0, im = 0;
          const omega = (2 * Math.PI * k) / fftSize;
          for (let n = 0; n < fftSize; n++) {
            const sample = analysisPcm[i + n] * windowFunc[n];
            re += sample * Math.cos(omega * n);
            im -= sample * Math.sin(omega * n);
          }
          const mag = Math.sqrt(re * re + im * im) / (fftSize / 2);
          bins[b] = mag > 0.00001 ? 20 * Math.log10(mag) : -100;
        }
        rawSpectrogramMatrix.push(bins);

        if (frameCount % 200 === 0 || frameCount === totalSteps - 1) {
          progressFill.style.width = `${Math.round((frameCount / totalSteps) * 100)}%`;
          await new Promise(r => setTimeout(r, 0));
        }
      }

      const highFreqStartBin = freqBinHzList.findIndex(f => f >= 1500);
      const startBin = highFreqStartBin >= 0 ? highFreqStartBin : 0;

      const powerSeries = rawSpectrogramMatrix.map(bins => {
        let sum = 0, count = 0;
        for (let k = startBin; k < bins.length; k++) {
          sum += bins[k];
          count++;
        }
        return count > 0 ? sum / count : -100;
      });

      cachedDeltaDbSeries = [];
      cachedReleaseThreshSeries = [];
      let currentThresh = 0.0;

      for (let i = 0; i < powerSeries.length; i++) {
        const lookback = Math.max(0, i - 3);
        let minBase = powerSeries[i];
        for (let j = lookback; j < i; j++) {
          if (powerSeries[j] < minBase) minBase = powerSeries[j];
        }

        const delta = Math.max(0, powerSeries[i] - minBase);
        cachedDeltaDbSeries.push(delta);

        if (delta > currentThresh) currentThresh = delta;
        else currentThresh = Math.max(0.0, currentThresh * 0.85);
        cachedReleaseThreshSeries.push(currentThresh);
      }

      setStatus("スライディングウィンドウ特徴量算出中...");
      const { X: windowX, validIndices } = extractWindowFeaturesFromMatrix(
        rawSpectrogramMatrix, cachedDeltaDbSeries, cachedReleaseThreshSeries, WINDOW_SIZE
      );

      setStatus("推論実行中...");
      cachedProbabilities = new Array(rawSpectrogramMatrix.length).fill(0.0);

      const batchSize = 100;
      for (let i = 0; i < windowX.length; i += batchSize) {
        const batch = windowX.slice(i, i + batchSize);
        const featDim = batch[0].length;
        const flatData = new Float32Array(batch.length * featDim);
        for (let r = 0; r < batch.length; r++) {
          flatData.set(batch[r], r * featDim);
        }

        const tensorInput = new ort.Tensor('float32', flatData, [batch.length, featDim]);
        const results = await session.run({ [inputName]: tensorInput });
        
        const batchProbs = extractPositiveProbabilities(results, outputNames, batch.length);

        for (let r = 0; r < batch.length; r++) {
          const frameIdx = validIndices[i + r];
          cachedProbabilities[frameIdx] = batchProbs[r] || 0.0;
        }

        progressFill.style.width = `${Math.round(((i + batch.length) / windowX.length) * 100)}%`;
        await new Promise(r => setTimeout(r, 0));
      }

      const highThresh = parseFloat(highThreshInput.value) || 0.65;
      const lowThresh = parseFloat(lowThreshInput.value) || 0.35;
      const cooldownMs = parseFloat(cooldownMsInput.value) >= 0 ? parseFloat(cooldownMsInput.value) : 60;

      let isStateON = false;
      const detectedHitFrames = [];
      let lastHitFrame = -Infinity;
      const cooldownFrames = Math.round((cooldownMs / 1000) / frameStepSec);

      for (let f = 0; f < cachedProbabilities.length; f++) {
        const p = cachedProbabilities[f];
        if (!isStateON) {
          if (p >= highThresh) {
            if (f - lastHitFrame >= cooldownFrames) {
              isStateON = true;
              detectedHitFrames.push(f);
              lastHitFrame = f;
            }
          }
        } else if (p <= lowThresh) {
          isStateON = false;
        }
      }

      teacherSteps = framesToSteps(detectedHitFrames);
      selectedStepId = null;

      refreshOutputs();

      setStatus("解析完了", "ready");
      progressBar.style.display = "none";
      resultCard.style.display = "block";

    } catch (err) {
      console.error(err);
      setStatus(`エラー: ${err.message}`, "error");
      progressBar.style.display = "none";
    } finally {
      analyzeBtn.disabled = false;
      fileInput.disabled = false;
      detectCallBtn.disabled = false;
    }
  };

  function refreshOutputs() {
    const activeFramesSet = new Set();
    teacherSteps.forEach(s => {
      for (let r = 0; r <= s.range; r++) {
        if (s.baseFrame + r < rawSpectrogramMatrix.length) {
          activeFramesSet.add(s.baseFrame + r);
        }
      }
    });

    const sortedBases = sortedBaseFrames();
    const rawHitCount = sortedBases.length;
    const halvedCount = rawHitCount / 2;

    const intervalValuesForAvg = [];
    const intervalMsSeries = new Array(rawSpectrogramMatrix.length).fill("0.0");

    for (let k = 1; k < sortedBases.length; k++) {
      const diffMs = ((sortedBases[k] - sortedBases[k - 1]) * frameStepSec * 1000).toFixed(1);
      intervalMsSeries[sortedBases[k]] = diffMs;
      intervalValuesForAvg.push(parseFloat(diffMs));
    }

    // 全データ出力（Delta_dB, Release_Threshold などの非学習変数を削除し、データ・統計量・Probabilityを追加）
    const numFreqBins = freqBinHzList.length;
    const csvHeader = [
      "Time_Sec",
      ...freqBinHzList.map(h => `${h}Hz`),
      ...freqBinHzList.map(h => `${h}Hz_ave`),
      ...freqBinHzList.map(h => `${h}Hz_std`),
      ...freqBinHzList.map(h => `${h}Hz_min`),
      ...freqBinHzList.map(h => `${h}Hz_max`),
      ...freqBinHzList.map(h => `${h}Hz_mean_abs_diff`),
      ...freqBinHzList.map(h => `${h}Hz_max_abs_diff`),
      "Probability",
      "Is_Count"
    ];
    const csvRows = [csvHeader.join(",")];

    for (let f = 0; f < rawSpectrogramMatrix.length; f++) {
      const isCountVal = activeFramesSet.has(f) ? 1 : 0;
      const timeSecStr = (currentStartSec + f * frameStepSec).toFixed(3);
      const rawBins = Array.from(rawSpectrogramMatrix[f]);

      // ウィンドウ統計量の算出 (WINDOW_SIZE = 8)
      const windowRows = [];
      for (let w = Math.max(0, f - WINDOW_SIZE + 1); w <= f; w++) {
        windowRows.push(rawSpectrogramMatrix[w]);
      }
      const actualWindowSize = windowRows.length;

      const fMean = new Array(numFreqBins).fill(0);
      const fStd = new Array(numFreqBins).fill(0);
      const fMin = new Array(numFreqBins).fill(0);
      const fMax = new Array(numFreqBins).fill(0);
      const fMeanAbsDiff = new Array(numFreqBins).fill(0);
      const fMaxAbsDiff = new Array(numFreqBins).fill(0);

      for (let c = 0; c < numFreqBins; c++) {
        let sum = 0, minV = Infinity, maxV = -Infinity;
        for (let r = 0; r < actualWindowSize; r++) {
          const v = windowRows[r][c];
          sum += v;
          if (v < minV) minV = v;
          if (v > maxV) maxV = v;
        }
        const meanV = sum / actualWindowSize;
        fMean[c] = meanV;
        fMin[c] = minV;
        fMax[c] = maxV;

        let varSum = 0, diffSum = 0, maxD = 0;
        for (let r = 0; r < actualWindowSize; r++) {
          const d = windowRows[r][c] - meanV;
          varSum += d * d;
          if (r > 0) {
            const ad = Math.abs(windowRows[r][c] - windowRows[r - 1][c]);
            diffSum += ad;
            if (ad > maxD) maxD = ad;
          }
        }
        fStd[c] = Math.sqrt(varSum / actualWindowSize);
        fMeanAbsDiff[c] = actualWindowSize > 1 ? diffSum / (actualWindowSize - 1) : 0;
        fMaxAbsDiff[c] = maxD;
      }

      const probVal = (cachedProbabilities && cachedProbabilities[f] !== undefined) ? cachedProbabilities[f].toFixed(4) : "0.0000";

      const rowData = [
        timeSecStr,
        ...rawBins.map(v => v.toFixed(2)),
        ...fMean.map(v => v.toFixed(2)),
        ...fStd.map(v => v.toFixed(2)),
        ...fMin.map(v => v.toFixed(2)),
        ...fMax.map(v => v.toFixed(2)),
        ...fMeanAbsDiff.map(v => v.toFixed(2)),
        ...fMaxAbsDiff.map(v => v.toFixed(2)),
        probVal,
        isCountVal
      ];
      csvRows.push(rowData.join(","));
    }
    generatedCsvText = csvRows.join("\n");
    downloadCsvBtn.disabled = false;

    const stepCsvRows = [["ID", "Count", "Timestamp_Sec", "Pace"].join(",")];
    for (let k = 0; k < sortedBases.length; k++) {
      const tsSec = currentStartSec + sortedBases[k] * frameStepSec;
      const countVal = (k + 1) / 2;
      let paceVal = "";
      if (k > 0) {
        const diffTs = tsSec - (currentStartSec + sortedBases[k - 1] * frameStepSec);
        if (diffTs > 0) paceVal = (15 / diffTs).toFixed(2);
      }
      stepCsvRows.push([k + 1, countVal, tsSec.toFixed(3), paceVal].join(","));
    }
    generatedStepCsvText = stepCsvRows.join("\n");
    downloadStepCsvBtn.disabled = false;

    const avgInterval = intervalValuesForAvg.length > 0
      ? (intervalValuesForAvg.reduce((a, b) => a + b, 0) / intervalValuesForAvg.length).toFixed(1)
      : "0.0";

    const oddIntervals = [];
    const evenIntervals = [];
    for (let k = 2; k < sortedBases.length; k++) {
      const diff = (sortedBases[k] - sortedBases[k - 1]) * frameStepSec * 1000;
      if ((k + 1) % 2 === 1) oddIntervals.push(diff);
      else evenIntervals.push(diff);
    }
    const oddAvg = oddIntervals.length ? (oddIntervals.reduce((a,b)=>a+b,0)/oddIntervals.length).toFixed(1) : '-';
    const evenAvg = evenIntervals.length ? (evenIntervals.reduce((a,b)=>a+b,0)/evenIntervals.length).toFixed(1) : '-';

    document.getElementById('countStepDisplay').textContent = `${halvedCount}`;
    document.getElementById('avgIntervalMs').textContent = avgInterval;
    oddEvenIntervalDetail.textContent = `奇数: ${oddAvg}ms　偶数: ${evenAvg}ms`;
    document.getElementById('positiveFrames').textContent = rawHitCount;

    drawIntervalChart();
  }

  downloadCsvBtn.onclick = () => downloadFile(generatedCsvText, `${loadedFileNameWithoutExt}_matrix.csv`);
  downloadStepCsvBtn.onclick = () => downloadFile(generatedStepCsvText, `${loadedFileNameWithoutExt}_steplog.csv`);
  downloadPaceChartBtn.onclick = () => openPaceAnalysisModal();
  downloadEditorPaceChartBtn.onclick = () => openPaceAnalysisModal();

  function parseStepLogs() {
    const lines = generatedStepCsvText.trim().split(/\r?\n/);
    if (lines.length <= 1) return [];
    const logs = [];
    for (let i = 1; i < lines.length; i++) {
      const cols = lines[i].split(',');
      if (cols.length >= 4) {
        const id = parseInt(cols[0]);
        const ts = parseFloat(cols[2]);
        const val = cols[3] !== "" ? parseFloat(cols[3]) : null;
        logs.push({ id, unixMs: ts * 1000, calculatedValue: val });
      }
    }
    return logs;
  }

  function openPaceAnalysisModal() {
    const logs = parseStepLogs();
    const validMaxId = logs.reduce((max, log) => log.id > max ? log.id : max, 0);

    if (validMaxId < 3) {
      alert("計測ログが3件未満のため、ペース分析を実行できません。");
      return;
    }

    startTagInput.value = "3";
    endTagInput.value = validMaxId.toString();
    paceModal.classList.add('active');
  }

  cancelPaceModalBtn.onclick = () => {
    paceModal.classList.remove('active');
  };

  confirmPaceModalBtn.onclick = () => {
    const startTag = parseInt(startTagInput.value);
    const endTag = parseInt(endTagInput.value);
    const title = paceTitleInput.value.trim() || "ペース分析";
    const removeOutliers = removeOutliersToggle.checked;

    const logs = parseStepLogs();
    const filteredLogs = logs.filter(l => l.id >= startTag && l.id <= endTag && l.calculatedValue !== null);

    if (filteredLogs.length < 2) {
      alert("指定された範囲内に有効なデータが2件以上ありません。");
      return;
    }

    generateAndDownloadPaceChart(filteredLogs, logs[0].unixMs, title, removeOutliers);
    paceModal.classList.remove('active');
  };

  function generateAndDownloadPaceChart(filteredLogs, baseUnixMs, title, removeOutliers) {
    const exportCanvas = document.createElement('canvas');
    exportCanvas.width = 1200;
    exportCanvas.height = 700;
    const ctx = exportCanvas.getContext('2d');

    const P = filteredLogs.map(l => ({
      x: (l.unixMs - baseUnixMs) / 1000,
      y: l.calculatedValue,
      id: l.id
    }));

    let P_valid = [];
    let P_outlier = [];

    if (removeOutliers) {
      const yValues = P.map(p => p.y).sort((a, b) => a - b);
      const getPercentile = (arr, p) => {
        const idx = (arr.length - 1) * p;
        const lower = Math.floor(idx);
        const upper = Math.ceil(idx);
        const weight = idx - lower;
        return arr[lower] * (1 - weight) + arr[upper] * weight;
      };

      const Q1 = getPercentile(yValues, 0.25);
      const Q3 = getPercentile(yValues, 0.75);
      const IQR = Q3 - Q1;
      const minAllowed = Q1 - 1.5 * IQR;
      const maxAllowed = Q3 + 1.5 * IQR;

      const validCandidate = P.filter(p => p.y >= minAllowed && p.y <= maxAllowed);
      if (validCandidate.length >= 2) {
        P_valid = validCandidate;
        P_outlier = P.filter(p => p.y < minAllowed || p.y > maxAllowed);
      } else {
        P_valid = [...P];
        P_outlier = [];
      }
    } else {
      P_valid = [...P];
      P_outlier = [];
    }

    const n = P_valid.length;
    let sumX = 0, sumY = 0, sumXY = 0, sumX2 = 0;
    for (let p of P_valid) {
      sumX += p.x;
      sumY += p.y;
      sumXY += p.x * p.y;
      sumX2 += p.x * p.x;
    }

    const a = (n * sumXY - sumX * sumY) / (n * sumX2 - sumX * sumX);
    const b = (sumY - a * sumX) / n;

    const x_start = P_valid[0].x;
    const x_end = P_valid[n - 1].x;
    const y_start = a * x_start + b;
    const y_end = a * x_end + b;
    const ratio = (y_end / y_start) * 100;

    const bSign = b >= 0 ? '+' : '-';
    const formulaStr = `y = ${a.toFixed(4)}x ${bSign} ${Math.abs(b).toFixed(2)} (${y_start.toFixed(2)} → ${y_end.toFixed(2)}) ${ratio.toFixed(1)}%`;

    ctx.fillStyle = '#18181b';
    ctx.fillRect(0, 0, 1200, 700);

    const margin = { top: 80, right: 60, bottom: 80, left: 100 };
    const plotW = 1040;
    const plotH = 540;

    ctx.fillStyle = '#f4f4f5';
    ctx.font = 'bold 28px Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(title, 600, 45);

    const allX = P.map(p => p.x);
    const allY = P.map(p => p.y);
    let minX = Math.min(...allX);
    let maxX = Math.max(...allX);
    let minY = Math.min(...allY);
    let maxY = Math.max(...allY);

    if (minX === maxX) { minX -= 1; maxX += 1; }
    if (minY === maxY) { minY -= 1; maxY += 1; }

    const padX = (maxX - minX) * 0.05;
    const padY = (maxY - minY) * 0.08;
    const plotMinX = minX - padX;
    const plotMaxX = maxX + padX;
    const plotMinY = minY - padY;
    const plotMaxY = maxY + padY;

    const mapX = (x) => margin.left + ((x - plotMinX) / (plotMaxX - plotMinX)) * plotW;
    const mapY = (y) => margin.top + plotH - ((y - plotMinY) / (plotMaxY - plotMinY)) * plotH;

    ctx.strokeStyle = '#3f3f46';
    ctx.lineWidth = 1;
    ctx.fillStyle = '#71717a';
    ctx.font = '14px Roboto, sans-serif';

    for (let i = 0; i <= 5; i++) {
      const gx = margin.left + (plotW / 5) * i;
      const valX = plotMinX + ((plotMaxX - plotMinX) / 5) * i;
      ctx.beginPath();
      ctx.moveTo(gx, margin.top);
      ctx.lineTo(gx, margin.top + plotH);
      ctx.stroke();
      ctx.textAlign = 'center';
      ctx.fillText(valX.toFixed(1), gx, margin.top + plotH + 25);
    }

    for (let i = 0; i <= 5; i++) {
      const gy = margin.top + (plotH / 5) * i;
      const valY = plotMaxY - ((plotMaxY - plotMinY) / 5) * i;
      ctx.beginPath();
      ctx.moveTo(margin.left, gy);
      ctx.lineTo(margin.left + plotW, gy);
      ctx.stroke();
      ctx.textAlign = 'right';
      ctx.fillText(valY.toFixed(1), margin.left - 15, gy + 5);
    }

    ctx.strokeStyle = '#3f3f46';
    ctx.lineWidth = 2;
    ctx.strokeRect(margin.left, margin.top, plotW, plotH);

    ctx.fillStyle = '#f4f4f5';
    ctx.font = '16px Roboto, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('時間 (s)', margin.left + plotW / 2, 670);

    ctx.save();
    ctx.translate(35, margin.top + plotH / 2);
    ctx.rotate(-Math.PI / 2);
    ctx.fillText('ペース', 0, 0);
    ctx.restore();

    ctx.strokeStyle = '#007aff';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let i = 0; i < P_valid.length; i++) {
      const px = mapX(P_valid[i].x);
      const py = mapY(P_valid[i].y);
      if (i === 0) ctx.moveTo(px, py);
      else ctx.lineTo(px, py);
    }
    ctx.stroke();

    ctx.fillStyle = '#5AC8FA';
    for (let p of P_valid) {
      ctx.beginPath();
      ctx.arc(mapX(p.x), mapY(p.y), 5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.fillStyle = '#71717a';
    for (let p of P_outlier) {
      ctx.beginPath();
      ctx.arc(mapX(p.x), mapY(p.y), 4.5, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.strokeStyle = '#ff3b30';
    ctx.lineWidth = 2.5;
    ctx.setLineDash([8, 6]);
    ctx.beginPath();
    const trendY1 = a * plotMinX + b;
    const trendY2 = a * plotMaxX + b;
    ctx.moveTo(mapX(plotMinX), mapY(trendY1));
    ctx.lineTo(mapX(plotMaxX), mapY(trendY2));
    ctx.stroke();
    ctx.setLineDash([]);

    ctx.font = '16px Roboto, sans-serif';
    const textWidth = ctx.measureText(formulaStr).width;
    const boxWidth = textWidth + 30;
    const boxHeight = 40;
    const boxX = margin.left + 20;
    const boxY = margin.top + 20;

    ctx.fillStyle = 'rgba(24, 24, 27, 0.9)';
    ctx.strokeStyle = '#3f3f46';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.roundRect(boxX, boxY, boxWidth, boxHeight, 6);
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = '#ff3b30';
    ctx.textAlign = 'left';
    ctx.fillText(formulaStr, boxX + 15, boxY + 25);

    const aTag = document.createElement('a');
    aTag.href = exportCanvas.toDataURL('image/png');
    aTag.download = `${title}.png`;
    aTag.click();
  }

  function downloadFile(content, filename) {
    const blob = new Blob([content], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    a.click();
    URL.revokeObjectURL(url);
  }

  function drawIntervalChart() {
    drawIntervalChartToCanvas(canvas);
  }

  function drawIntervalChartToCanvas(targetCanvas) {
    const cCtx = targetCanvas.getContext('2d');
    const width = targetCanvas.width = targetCanvas.clientWidth || targetCanvas.width;
    const height = targetCanvas.height = targetCanvas.clientHeight || targetCanvas.height;
    cCtx.clearRect(0, 0, width, height);

    const sortedBases = sortedBaseFrames();
    if (sortedBases.length < 2) {
      cCtx.fillStyle = '#94a3b8';
      cCtx.font = '12px Roboto, sans-serif';
      cCtx.textAlign = 'center';
      cCtx.fillText('データ件数が少なすぎるためグラフを表示できません', width / 2, height / 2);
      return;
    }

    const points = [];
    for (let k = 1; k < sortedBases.length; k++) {
      const currSec = currentStartSec + sortedBases[k] * frameStepSec;
      const prevSec = currentStartSec + sortedBases[k - 1] * frameStepSec;
      points.push({ time: currSec, interval: (currSec - prevSec) * 1000 });
    }

    const margin = { top: 35, right: 30, bottom: 40, left: 55 };
    const plotWidth = width - margin.left - margin.right;
    const plotHeight = height - margin.top - margin.bottom;

    const times = points.map(p => p.time);
    const intervals = points.map(p => p.interval);
    let minX = Math.min(...times), maxX = Math.max(...times);
    let minY = Math.min(...intervals), maxY = Math.max(...intervals);

    const padX = (maxX - minX) * 0.05 || 1;
    const padY = (maxY - minY) * 0.15 || 20;
    minX -= padX; maxX += padX;
    minY -= padY; maxY += padY;

    function mapX(t) { return margin.left + ((t - minX) / (maxX - minX)) * plotWidth; }
    function mapY(v) { return margin.top + plotHeight - ((v - minY) / (maxY - minY)) * plotHeight; }

    cCtx.fillStyle = '#0f172a';
    cCtx.fillRect(0, 0, width, height);

    cCtx.strokeStyle = '#334155';
    cCtx.lineWidth = 1;
    cCtx.fillStyle = '#94a3b8';
    cCtx.font = '11px Roboto, sans-serif';

    for (let i = 0; i <= 4; i++) {
      const gy = margin.top + (plotHeight / 4) * i;
      const valY = maxY - ((maxY - minY) / 4) * i;
      cCtx.beginPath(); cCtx.moveTo(margin.left, gy); cCtx.lineTo(margin.left + plotWidth, gy); cCtx.stroke();
      cCtx.fillText(`${Math.round(valY)}ms`, margin.left - 45, gy + 4);
    }

    cCtx.fillStyle = '#38bdf8';
    cCtx.font = 'bold 13px Roboto, sans-serif';
    cCtx.fillText('ペース・インターバル推移 (ms)', margin.left, 20);

    cCtx.strokeStyle = '#38bdf8';
    cCtx.lineWidth = 2;
    cCtx.beginPath();
    for (let i = 0; i < points.length; i++) {
      const px = mapX(points[i].time), py = mapY(points[i].interval);
      if (i === 0) cCtx.moveTo(px, py); else cCtx.lineTo(px, py);
    }
    cCtx.stroke();

    cCtx.fillStyle = '#ef4444';
    for (const p of points) {
      cCtx.beginPath(); cCtx.arc(mapX(p.time), mapY(p.interval), 4, 0, Math.PI * 2); cCtx.fill();
    }
  }

  verticalZoomInput.oninput = () => {
    verticalZoomFactor = parseFloat(verticalZoomInput.value);
    zoomLabel.textContent = `${Math.round((verticalZoomFactor / 15) * 100)}%`;
    renderDebugEditor();
  };

  openDebugModalBtn.onclick = () => {
    if (rawSpectrogramMatrix.length === 0) {
      alert("解析データがありません。");
      return;
    }
    calculateDisplayDynamicRange();
    debugModal.classList.add('active');
    renderDebugEditor();
  };

  closeDebugModalBtn.onclick = () => {
    debugModal.classList.remove('active');
    refreshOutputs();
    resultCard.style.display = "block";
  };

  function calculateDisplayDynamicRange() {
    let startBin1000Hz = freqBinHzList.findIndex(f => f >= 1000);
    if (startBin1000Hz === -1) startBin1000Hz = 0;

    let min = 1000;
    let max = -1000;

    for (let f = 0; f < rawSpectrogramMatrix.length; f++) {
      const bins = rawSpectrogramMatrix[f];
      for (let b = startBin1000Hz; b < bins.length; b++) {
        const val = bins[b];
        if (val > -99) {
          if (val < min) min = val;
          if (val > max) max = val;
        }
      }
    }

    dynamicMinDb = min < max ? min : -80;
    dynamicMaxDb = min < max ? max : -10;
  }

  function getRedWhiteGreenColor(valDb) {
    const norm = Math.max(0, Math.min(1, (valDb - dynamicMinDb) / (dynamicMaxDb - dynamicMinDb)));

    let r = 0, g = 0, b = 0;
    if (norm < 0.35) {
      const t = norm / 0.35;
      r = 235;
      g = Math.floor(40 + 215 * t);
      b = Math.floor(40 + 215 * t);
    } else {
      const t = (norm - 0.35) / 0.65;
      r = Math.floor(255 * (1 - t * 0.95));
      g = Math.floor(255 - t * 110);
      b = Math.floor(255 - t * 0.9);
    }
    return `rgb(${r},${g},${b})`;
  }

  function getIntervalColor(interval, minI, avgI, maxI) {
    if (minI === maxI) return 'rgb(255, 255, 255)';
    let r, g, b;
    if (interval <= avgI) {
      const t = (avgI - minI) > 0 ? Math.max(0, Math.min(1, (interval - minI) / (avgI - minI))) : 1;
      r = Math.round(239 + (255 - 239) * t);
      g = Math.round(68 + (255 - 68) * t);
      b = Math.round(68 + (255 - 68) * t);
    } else {
      const t = (maxI - avgI) > 0 ? Math.max(0, Math.min(1, (interval - avgI) / (maxI - avgI))) : 1;
      r = Math.round(255 + (34 - 255) * t);
      g = Math.round(255 + (195 - 255) * t);
      b = Math.round(255 + (94 - 255) * t);
    }
    return `rgb(${r}, ${g}, ${b})`;
  }

  function updateStepEditPanel() {
    const step = findStepById(selectedStepId);
    if (!step) {
      stepSelectionStatus.textContent = '非選択中';
      selectedStepInfo.style.display = 'none';
      stepEditPanel.classList.add('step-edit-panel-disabled');
      stepRangeSlider.disabled = true;
      deselectStepBtn.disabled = true;
      stepRangeLabel.textContent = '-';
      selectedStepNum.textContent = '-';
      selectedStepFrame.textContent = '-';
      return;
    }
    const sorted = sortedBaseFrames();
    const idx = sorted.indexOf(step.baseFrame);
    stepSelectionStatus.textContent = '選択中';
    selectedStepInfo.style.display = 'inline';
    stepEditPanel.classList.remove('step-edit-panel-disabled');
    stepRangeSlider.disabled = false;
    deselectStepBtn.disabled = false;
    selectedStepNum.textContent = (idx >= 0 ? idx + 1 : '-');
    selectedStepFrame.textContent = step.baseFrame;
    stepRangeSlider.value = step.range;
    stepRangeLabel.textContent = step.range;
  }

  stepRangeSlider.oninput = () => {
    const step = findStepById(selectedStepId);
    if (step) {
      step.range = parseInt(stepRangeSlider.value);
      stepRangeLabel.textContent = step.range;
      renderDebugEditor();
    }
  };

  deselectStepBtn.onclick = () => {
    selectedStepId = null;
    updateStepEditPanel();
    renderDebugEditor();
  };

  window.addEventListener('keydown', (e) => {
    if (!debugModal.classList.contains('active')) return;
    if (!selectedStepId) return;

    if (['3', '4', '5', '6', '2'].includes(e.key)) {
      const step = findStepById(selectedStepId);
      if (step) {
        step.range = parseInt(e.key);
        updateStepEditPanel();
        renderDebugEditor();
        debugStatusText.textContent = `ステップの範囲を ${step.range} に変更しました`;
      }
    }
  });

  function renderDebugEditor() {
    const containerWidth = debugCanvasContainer.clientWidth;
    const rowHeight = verticalZoomFactor;
    const totalFrames = rawSpectrogramMatrix.length;
    
    const nextCanvasWidth = Math.max(300, containerWidth);
    const nextCanvasHeight = Math.max(debugCanvasContainer.clientHeight, totalFrames * rowHeight);

    if (debugCanvas.width !== nextCanvasWidth) debugCanvas.width = nextCanvasWidth;
    if (debugCanvas.height !== nextCanvasHeight) debugCanvas.height = nextCanvasHeight;

    debugCanvas.style.width = `${nextCanvasWidth}px`;
    debugCanvas.style.height = `${nextCanvasHeight}px`;

    const width = debugCanvas.width;
    const height = debugCanvas.height;
    debugCtx.clearRect(0, 0, width, height);

    let startBin1000Hz = freqBinHzList.findIndex(f => f >= 1000);
    if (startBin1000Hz === -1) startBin1000Hz = 0;
    const activeBinsCount = freqBinHzList.length - startBin1000Hz;

    const scrollTop = debugCanvasContainer.scrollTop;
    const containerHeight = debugCanvasContainer.clientHeight;
    const startFrame = Math.max(0, Math.floor((scrollTop - 50) / rowHeight));
    const endFrame = Math.min(totalFrames, Math.ceil((scrollTop + containerHeight + 50) / rowHeight));

    const stepX = 2;
    for (let f = startFrame; f < endFrame; f++) {
      const y = f * rowHeight;
      const bins = rawSpectrogramMatrix[f];

      for (let x = 0; x < width; x += stepX) {
        const relBinIndex = Math.floor(Math.pow(x / width, 1.8) * activeBinsCount);
        const actualBinIndex = Math.min(startBin1000Hz + relBinIndex, freqBinHzList.length - 1);
        const val = bins[actualBinIndex] || -100;

        debugCtx.fillStyle = getRedWhiteGreenColor(val);
        debugCtx.fillRect(x, y, stepX, Math.max(1, rowHeight));
      }
    }

    const intervalSec = 5;
    const framesPerInterval = Math.round(intervalSec / frameStepSec);
    const firstIntervalIdx = Math.ceil((startFrame * frameStepSec) / intervalSec);
    const lastIntervalIdx = Math.floor((endFrame * frameStepSec) / intervalSec);

    debugCtx.font = 'bold 11px Roboto, sans-serif';
    debugCtx.textAlign = 'right';
    debugCtx.textBaseline = 'middle';

    for (let idx = firstIntervalIdx; idx <= lastIntervalIdx; idx++) {
      const frameIdx = idx * framesPerInterval;
      if (frameIdx < 0 || frameIdx >= totalFrames) continue;

      const y = frameIdx * rowHeight;
      const currentSec = currentStartSec + frameIdx * frameStepSec;
      const min = Math.floor(currentSec / 60);
      const sec = (currentSec % 60).toFixed(1);
      const labelText = `${min.toString().padStart(2, '0')}:${sec.padStart(4, '0')}s`;

      debugCtx.strokeStyle = 'rgba(255, 255, 255, 0.3)';
      debugCtx.lineWidth = 1;
      debugCtx.beginPath();
      debugCtx.moveTo(0, y);
      debugCtx.lineTo(width, y);
      debugCtx.stroke();

      debugCtx.fillStyle = 'rgba(15, 23, 42, 0.75)';
      debugCtx.fillRect(width - 85, y - 9, 80, 18);

      debugCtx.fillStyle = '#38bdf8';
      debugCtx.fillText(labelText, width - 10, y);
    }

    const centerY = scrollTop + containerHeight / 2;
    debugCtx.fillStyle = '#ef4444';
    debugCtx.strokeStyle = '#ffffff';
    debugCtx.lineWidth = 1.5;
    debugCtx.beginPath();
    debugCtx.moveTo(0, centerY - 10);
    debugCtx.lineTo(16, centerY);
    debugCtx.lineTo(0, centerY + 10);
    debugCtx.closePath();
    debugCtx.fill();
    debugCtx.stroke();

    const sortedSteps = [...teacherSteps].sort((a, b) => a.baseFrame - b.baseFrame);
    const stepOrderMap = new Map();
    const intervals = [];

    sortedSteps.forEach((s, idx) => {
      stepOrderMap.set(s.id, idx + 1);
      if (idx > 0) {
        const interval = (s.baseFrame - sortedSteps[idx - 1].baseFrame) * frameStepSec * 1000;
        intervals.push(interval);
      }
    });

    const minInterval = intervals.length > 0 ? Math.min(...intervals) : 0;
    const maxInterval = intervals.length > 0 ? Math.max(...intervals) : 0;
    const avgInterval = intervals.length > 0 ? intervals.reduce((a, b) => a + b, 0) / intervals.length : 0;

    debugCtx.font = '18px "Material Icons"';
    debugCtx.textAlign = 'center';
    debugCtx.textBaseline = 'middle';

    teacherSteps.forEach((step) => {
      const frameIdx = step.baseFrame;
      if (frameIdx < startFrame - 10 || frameIdx > endFrame + 10) return;

      const topY = frameIdx * rowHeight;
      const boxHeight = (step.range + 1) * rowHeight;
      const isSelected = (step.id === selectedStepId);

      debugCtx.fillStyle = isSelected ? 'rgba(34, 211, 238, 0.25)' : 'rgba(249, 115, 22, 0.15)';
      debugCtx.fillRect(50, topY, width - 110, boxHeight);

      debugCtx.strokeStyle = isSelected ? '#22d3ee' : '#f97316';
      debugCtx.lineWidth = isSelected ? 3 : 1.5;
      debugCtx.strokeRect(50, topY, width - 110, boxHeight);

      const seqNum = stepOrderMap.get(step.id) || 0;
      let intervalStr = "0.0";
      let intervalVal = 0;
      if (seqNum > 1) {
        const prevStep = sortedSteps[seqNum - 2];
        intervalVal = (step.baseFrame - prevStep.baseFrame) * frameStepSec * 1000;
        intervalStr = intervalVal.toFixed(1);
      }

      const labelText = `#${seqNum} ${intervalStr}ms`;
      const labelColor = seqNum > 1 ? getIntervalColor(intervalVal, minInterval, avgInterval, maxInterval) : '#ffffff';

      debugCtx.save();
      debugCtx.font = 'bold 11px Roboto, sans-serif';
      debugCtx.textAlign = 'left';
      debugCtx.textBaseline = 'bottom';
      const labelWidth = debugCtx.measureText(labelText).width + 8;
      debugCtx.fillStyle = '#000000';
      debugCtx.fillRect(47, topY - 15, labelWidth, 14);
      debugCtx.fillStyle = labelColor;
      debugCtx.fillText(labelText, 51, topY - 3);
      debugCtx.restore();

      const midY = topY + boxHeight / 2;

      debugCtx.fillStyle = '#ffffff';
      debugCtx.beginPath();
      debugCtx.arc(20, midY, 16, 0, Math.PI * 2);
      debugCtx.fill();

      debugCtx.fillStyle = '#ef4444';
      debugCtx.fillText('delete', 20, midY);

      debugCtx.fillStyle = '#ffffff';
      debugCtx.beginPath();
      debugCtx.arc(width - 20, midY, 16, 0, Math.PI * 2);
      debugCtx.fill();

      debugCtx.fillStyle = '#0284c7';
      debugCtx.fillText('open_with', width - 20, midY);
    });
  }

  debugCanvasContainer.addEventListener('scroll', () => {
    requestAnimationFrame(renderDebugEditor);
  });

  function getCanvasCoords(e) {
    const containerRect = debugCanvasContainer.getBoundingClientRect();
    const clientX = e.touches && e.touches.length > 0 ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches && e.touches.length > 0 ? e.touches[0].clientY : e.clientY;

    return {
      x: clientX - containerRect.left,
      y: (clientY - containerRect.top) + debugCanvasContainer.scrollTop
    };
  }

  function handlePointerDown(e) {
    const { x, y } = getCanvasCoords(e);
    const rowHeight = verticalZoomFactor;

    let hitIndex = -1;
    let hitStep = null;

    for (let i = 0; i < teacherSteps.length; i++) {
      const s = teacherSteps[i];
      const topY = s.baseFrame * rowHeight;
      const botY = topY + (s.range + 1) * rowHeight;
      const margin = Math.max(12, rowHeight * 1.5);
      if (y >= topY - margin && y <= botY + margin) {
        hitIndex = i;
        hitStep = s;
        break;
      }
    }

    if (x <= 50) {
      if (hitIndex >= 0) {
        if (selectedStepId === hitStep.id) {
          selectedStepId = null;
          updateStepEditPanel();
        }
        teacherSteps.splice(hitIndex, 1);
        renderDebugEditor();
        debugStatusText.textContent = `ステップを削除しました (残り: ${teacherSteps.length}件)`;
        if (e.cancelable) e.preventDefault();
      }
      return;
    }

    if (x >= debugCanvas.width - 60) {
      if (hitIndex >= 0) {
        isDraggingStep = hitIndex;
        selectedStepId = hitStep.id;
        updateStepEditPanel();
        debugStatusText.textContent = `ステップドラッグ移動中...`;
        renderDebugEditor();
        if (e.cancelable) e.preventDefault();
      }
      return;
    }

    if (hitStep) {
      selectedStepId = hitStep.id;
      updateStepEditPanel();
      renderDebugEditor();
      debugStatusText.textContent = `ステップを選択しました (範囲: ${hitStep.range})`;
    } else {
      selectedStepId = null;
      updateStepEditPanel();
      renderDebugEditor();
    }
  }

  function handlePointerMove(e) {
    if (isDraggingStep === null) return;

    const { y } = getCanvasCoords(e);
    const rowHeight = verticalZoomFactor;

    const newFrame = Math.max(0, Math.min(rawSpectrogramMatrix.length - 1, Math.floor(y / rowHeight)));
    teacherSteps[isDraggingStep].baseFrame = newFrame;
    updateStepEditPanel();

    requestAnimationFrame(renderDebugEditor);
    if (e.cancelable) e.preventDefault();
  }

  function handlePointerUp() {
    if (isDraggingStep !== null) {
      isDraggingStep = null;
      teacherSteps.sort((a, b) => a.baseFrame - b.baseFrame);
      updateStepEditPanel();
      renderDebugEditor();
      debugStatusText.textContent = "ステップ位置を移動・確定しました";
    }
  }

  debugCanvas.addEventListener('mousedown', handlePointerDown);
  window.addEventListener('mousemove', handlePointerMove);
  window.addEventListener('mouseup', handlePointerUp);

  debugCanvas.addEventListener('touchstart', handlePointerDown, { passive: false });
  window.addEventListener('touchmove', handlePointerMove, { passive: false });
  window.addEventListener('touchend', handlePointerUp);
  window.addEventListener('touchcancel', handlePointerUp);

  addStepBtn.onclick = () => {
    const rowHeight = verticalZoomFactor;
    const centerFrame = Math.floor((debugCanvasContainer.scrollTop + debugCanvasContainer.clientHeight / 2) / rowHeight);
    const targetFrame = Math.max(0, Math.min(rawSpectrogramMatrix.length - 1, centerFrame));

    const newStep = { id: ++stepIdCounter, baseFrame: targetFrame, range: 3 };
    teacherSteps.push(newStep);
    teacherSteps.sort((a, b) => a.baseFrame - b.baseFrame);
    selectedStepId = newStep.id;

    updateStepEditPanel();
    renderDebugEditor();
    debugStatusText.textContent = `画面中央にステップを追加しました (合計: ${teacherSteps.length}件)`;
  };

  exportLearningCsvBtn.onclick = () => {
    refreshOutputs();
    downloadFile(generatedCsvText, `${loadedFileNameWithoutExt}_learning_matrix_${Date.now()}.csv`);
    debugModal.classList.remove('active');
    setStatus("学習用CSVを出力しました", "ready");
  };
</script>

</body>
</html>
